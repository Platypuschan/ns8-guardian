# Generic HTTP scanner behavior seen by NS8 Traefik: one client requesting many DIFFERENT
# missing/forbidden paths in a short time. Not a WAF: no payload inspection, only access-log status codes.
{
  "type": "leaky",
  "name": "ns8/ns8-http-probing",
  "description": "HTTP path scanning (many distinct 403/404 paths from one client)",
  "filter": "evt.Meta.log_type == 'ns8_traefik_access' && evt.Meta.http_status in ['403', '404']",
  "groupby": "evt.Meta.source_ip",
  "distinct": "evt.Meta.http_path",
  "capacity": 30,
  "leakspeed": "10s",
  "blackhole": "1m",
  "labels": {
    "service": "ns8",
    "behavior": "http:scan",
    "classification": [
      "attack.T1595"
    ],
    "label": "HTTP path scanning",
    "remediation": true
  }
}
